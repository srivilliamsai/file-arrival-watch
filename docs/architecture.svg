    <text class="detail" x="12" y="50">Cutoff and reference</text>
  </g>

  <circle cx="44" cy="826" r="4" fill="#ff682c"/>
  <text class="footnote" x="57" y="831">SQS keeps failed events · CloudWatch records logs and alarms</text>
</svg>
