    <text class="name" x="12" y="28">Amazon S3</text>
    <text class="detail" x="12" y="50">Private CSV bucket</text>
  </g>
  <g transform="translate(590 450)">
    <rect width="190" height="68" fill="#202020"/>
    <text class="name inverse" x="12" y="28">Validation Lambda</text>
    <text class="detail inverse" x="12" y="50">Validate and check S3</text>
  </g>
  <g transform="translate(864 450)">
