    <text class="name" x="12" y="23">EventBridge Scheduler</text>
    <text class="detail" x="12" y="44">Warehouse time zone</text>
  </g>

  <g transform="translate(864 705)">
    <rect class="node" width="220" height="68"/>
    <text class="name" x="12" y="28">Notification Lambda</text>
    <text class="detail" x="12" y="50">Publish missed deadline</text>
  </g>
  <g transform="translate(590 705)">
    <rect class="node" width="190" height="68"/>
    <text class="name" x="12" y="28">Amazon SNS</text>
    <text class="detail" x="12" y="50">Email subscription</text>
  </g>
  <g transform="translate(310 705)">
