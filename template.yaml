AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: File Arrival Watch - warehouse CSV readiness and deadline alerts
Parameters:
  WarehouseName:
    Type: String
    Default: South Warehouse
    MaxLength: 80
  RequiredSkus:
    Type: String
    Default: ''
    MaxLength: 1024
    Description: Optional comma-separated list of critical SKUs that every snapshot must include
  WarehouseTimeZone:
    Type: String
    Default: Asia/Kolkata
    MaxLength: 64
    AllowedPattern: '[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*'
    Description: IANA time zone for the warehouse, such as Asia/Kolkata or America/New_York
  CutoffHour:
    Type: String
    Default: '08'
    AllowedPattern: '([01][0-9]|2[0-3])'
  CutoffMinute:
    Type: String
    Default: '00'
    AllowedPattern: '[0-5][0-9]'
  AlertEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
  CognitoDomainPrefix:
    Type: String
    Description: An available lowercase Cognito domain prefix for this AWS account
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,61}[a-z0-9]'
Globals:
  Function:
    Runtime: python3.13
    CodeUri: backend/
    MemorySize: 256
    LoggingConfig:
      LogFormat: Text
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: &PrivateBucket
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption: &Encryption
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls: &BucketOwnership
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-${AWS::Region}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-site-${AWS::AccountId}'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self';
              img-src 'self'; connect-src 'self' https://*.execute-api.${AWS::Region}.${AWS::URLSuffix}
              https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com;
              object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
  Site:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: web
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref SiteHeaders
          Compress: true
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Site}'
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-operators'
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UploadScope:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Name: File Arrival Watch
      Identifier: file-arrival
      Scopes:
        - ScopeName: upload
          ScopeDescription: Upload inventory and view validation results
  OperatorClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UploadScope
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [file-arrival/upload]
      CallbackURLs:
        - !Sub 'https://${Site.DomainName}/'
      LogoutURLs:
        - !Sub 'https://${Site.DomainName}/'
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      TokenValidityUnits:
        AccessToken: minutes
  OperatorDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Site.DomainName}'
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 25
        ThrottlingRateLimit: 15
      Auth:
        Authorizers:
          Operator:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [file-arrival/upload]
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
              audience: [!Ref OperatorClient]
  DeliveryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: delivery, AttributeType: S }
        - { AttributeName: record, AttributeType: S }
      KeySchema:
        - { AttributeName: delivery, KeyType: HASH }
        - { AttributeName: record, KeyType: RANGE }
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration: *PrivateBucket
      BucketEncryption: *Encryption
      OwnershipControls: *BucketOwnership
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDemoCSV
            Prefix: incoming/
            Status: Enabled
            ExpirationInDays: 30
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireCreateOnlyUploads
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${UploadBucket.Arn}/incoming/*'
            Condition:
              StringNotEquals:
                's3:if-none-match': '*'
  WorkFailures:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 604800
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api
      Timeout: 15
      Environment:
        Variables: &WorkflowEnvironment
          TABLE_NAME: !Ref DeliveryTable
          UPLOAD_BUCKET: !Sub '${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}'
          WAREHOUSE: !Ref WarehouseName
          WAREHOUSE_TIME_ZONE: !Ref WarehouseTimeZone
          CUTOFF: !Sub '${CutoffHour}:${CutoffMinute}'
          REQUIRED_SKUS: !Ref RequiredSkus
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt DeliveryTable.Arn
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}'
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}/incoming/*'
      Events:
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/status
        AddUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/uploads
            Auth:
              Authorizer: Operator
        ListUploads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/uploads
            Auth:
              Authorizer: Operator
        GetUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/uploads/{uploadId}
            Auth:
              Authorizer: Operator
  Worker:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.worker
      Timeout: 120
      Environment:
        Variables: *WorkflowEnvironment
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt WorkFailures.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt DeliveryTable.Arn
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}/incoming/*'
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt WorkFailures.Arn
      Events:
        CsvArrived:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: incoming/ }
                  - { Name: suffix, Value: .csv }
        DailyCutoff:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Sub 'cron(${CutoffMinute} ${CutoffHour} * * ? *)'
            ScheduleExpressionTimezone: !Ref WarehouseTimeZone
            FlexibleTimeWindow:
              Mode: 'OFF'
            Input: !Sub '{"kind":"deadline","scheduledAt":"<aws.scheduler.scheduled-time>","timeZone":"${WarehouseTimeZone}"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 3600
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Arn: !GetAtt WorkFailures.Arn
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.notify
      Timeout: 15
      Environment:
        Variables:
          ALERT_TOPIC: !Ref Alerts
          DASHBOARD_URL: !Sub 'https://${Site.DomainName}/'
      Policies:
        - DynamoDBStreamReadPolicy:
            TableName: !Ref DeliveryTable
            StreamName: '*'
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref Alerts
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt WorkFailures.Arn
      Events:
        MissedDeadline:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt DeliveryTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 1
            MaximumRetryAttempts: 2
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt WorkFailures.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"record":{"S":["DEADLINE"]},"outcome":{"S":["missing","invalid_file"]}}}}'
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 30
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Worker}'
      RetentionInDays: 30
  NotificationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NotificationFunction}'
      RetentionInDays: 30
  LambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A File Arrival Watch Lambda failed
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: api
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
            Period: 60
            Stat: Sum
        - Id: gateway
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
            Period: 60
            Stat: Sum
        - Id: worker
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref Worker }]
            Period: 60
            Stat: Sum
        - Id: notifier
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref NotificationFunction }]
            Period: 60
            Stat: Sum
        - Id: total
          Expression: api+gateway+worker+notifier
          ReturnData: true
  FailedEvents:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A delivery event exhausted its retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt WorkFailures.QueueName }]
      Period: 60
      EvaluationPeriods: 1
      Statistic: Maximum
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      TreatMissingData: notBreaching
Outputs:
  SiteUrl:
    Value: !Sub 'https://${Site.DomainName}/'
  DistributionId:
    Value: !Ref Site
  SiteBucketName:
    Value: !Ref SiteBucket
  UploadBucketName:
    Value: !Ref UploadBucket
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UserPoolId:
    Value: !Ref UserPool
  OperatorClientId:
    Value: !Ref OperatorClient
  AuthUrl:
    Value: !Sub 'https://${OperatorDomain}.auth.${AWS::Region}.amazoncognito.com'
  AlertTopicArn:
    Value: !Ref Alerts
  FailedEventsUrl:
    Value: !Ref WorkFailures
